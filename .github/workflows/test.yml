name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Monorepo Root Dependencies
      run: npm install

    - name: Install All Services Dependencies
      run: |
        npm run install:all

    - name: Generate Prisma Client
      run: npm run db:generate

    - name: Run Test Suite
      run: npm run test
      env:
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        JWT_SECRET: "test-secret"
        EXOTEL_API_KEY: "dummy"
        EXOTEL_API_TOKEN: "dummy"
        EXOTEL_ACCOUNT_SID: "dummy"
        EXOTEL_EXOPHONE: "dummy"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /app/lawmate
          git remote set-url origin https://github.com/Shugendo-Labs/Lawmate.git
          git fetch origin
          git reset --hard origin/main
          chmod +x deploy.sh
          ./deploy.sh
